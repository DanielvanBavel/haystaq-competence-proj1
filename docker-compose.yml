services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tijdwijs
      POSTGRES_PASSWORD: tijdwijs
      POSTGRES_DB: tijdwijs
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - tijdwijs-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tijdwijs -d tijdwijs" ]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: tijdwijs
      DB_USER: tijdwijs
      DB_PASSWORD: tijdwijs
      DEBUG_RULES: "${DEBUG_RULES:-false}"
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q UP" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      - backend

volumes:
  tijdwijs-data:
